name: khutwa_app
description: "Khutwa app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  intl: any
  url_launcher: ^6.3.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true

  # Cairo (OFL, see assets/google_fonts/OFL.txt), bundled so the app renders
  # offline from the first launch; google_fonts picks these files up by name.
  assets:
    - assets/google_fonts/
