# The laptop also runs the live API and its model workers: keep the build small.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
# Owner of the URL gist (not secret); the gist id and API key are read from backend/.env at build time.
khutwa.gistOwner=marwanelamami
