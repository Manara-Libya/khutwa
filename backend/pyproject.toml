[project]
name = "khutwa-api"
version = "0.1.0"
description = "Khutwa backend: secured, OpenAPI-documented API over the Antigravity CLI (agy)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["live: calls the real agy CLI (set KHUTWA_LIVE=1)"]
